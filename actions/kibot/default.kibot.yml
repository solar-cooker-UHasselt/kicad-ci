# Default KiBot config of kicad-ci, used by every solar-cooker-UHasselt board repo.
#
# What it does for each board:
#   - preflight: refill zones, run ERC and DRC, write the reports to reports/
#     (JSON for the job summary, HTML to read)
#   - outputs: the schematic and the board as PDF, a PcbDraw drawing and a 3D
#     render of each side as PNG, a BOM with the Eurocircuits columns as CSV and
#     HTML, all in outputs/
#
# Which boards use it: every board without its own config.kibot.yml. The kibot
# action picks this file then (see action.yml next to it).
#
# A board that needs more writes its own config.kibot.yml and imports this one:
#
#   kibot:
#     version: 1
#   import:
#     - file: "@KICAD_CI_DEFAULT@"   # the path of this file, set by the action
#   outputs:
#     - name: render-top            # the board's own extra output
#       type: render_3d
#
# A change here reaches every board once the v1 tag is moved.
kibot:
  version: 1

preflight:
  check_zone_fills: true
  erc:
    format: JSON,HTML
    dir: reports
  drc:
    format: JSON,HTML
    dir: reports

outputs:
  - name: schematic-pdf
    comment: Schematic, all sheets
    type: pdf_sch_print
    dir: outputs
    options:
      output: '%f-schematic.%x'

  - name: board-pdf
    comment: Copper and silkscreen, one page per layer, board outline on each page
    type: pcb_print
    dir: outputs
    options:
      output: '%f-board.%x'
      format: PDF
      plot_sheet_reference: true
      pages:
        - layers: [ F.Cu, Edge.Cuts ]
        - layers: [ B.Cu, Edge.Cuts ]
        - layers: [ F.Silkscreen, Edge.Cuts ]
        - layers: [ B.Silkscreen, Edge.Cuts ]

  - name: pcbdraw-top
    comment: Stylised 2D drawing of the top side
    type: pcbdraw
    dir: outputs
    options:
      output: '%f-pcbdraw-top.%x'
      format: png
      dpi: 600

  - name: pcbdraw-bottom
    comment: Stylised 2D drawing of the bottom side
    type: pcbdraw
    dir: outputs
    options:
      output: '%f-pcbdraw-bottom.%x'
      format: png
      dpi: 600
      bottom: true

  - name: render-top
    comment: 3D render of the top side, tilted 50 degrees and turned 30
    type: render_3d
    dir: outputs
    options:
      output: '%f-render-top.%x'
      view: top
      rotate_degrees: true
      rotate_x: 50
      rotate_z: 30
      # The camera centres on the board: zoom out and shift so pins below it fit
      zoom: -5
      move_y: 1
      ray_tracing: true
      auto_crop: true

  - name: render-bottom
    comment: 3D render of the bottom side, flipped over like by hand
    type: render_3d
    dir: outputs
    options:
      output: '%f-render-bottom.%x'
      view: bottom
      rotate_degrees: true
      rotate_x: 50
      rotate_z: 210
      zoom: -5
      move_y: -1
      ray_tracing: true
      auto_crop: true

  # The columns of the Eurocircuits BOM layout, from the parts' own fields.
  # Mounting holes, fiducials and test points are left out (exclude_filter
  # _mechanical, KiBot's default).
  - name: bom-csv
    comment: Bill of materials with the Eurocircuits columns, for the order
    type: bom
    dir: outputs
    options: &bom
      output: '%f-bom.%x'
      format: CSV
      # Only the table, so the file uploads as it is
      csv:
        hide_pcb_info: true
        hide_stats_info: true
      columns:
        - field: References
          name: Reference
        - field: Quantity Per PCB
          name: Qty
        - Manufacturer
        - MPN
        - Supplier
        - SPN
        - field: Footprint
          name: Component package type
        - Description

  - name: bom-html
    comment: The same bill of materials as a web page
    type: bom
    dir: outputs
    options:
      <<: *bom
      format: HTML
