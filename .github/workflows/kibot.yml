name: KiBot

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto:1.9.1-1_k10.0.4_d13.2
    steps:
      - uses: actions/checkout@v7
      - uses: solar-cooker-UHasselt/kicad-ci/actions/kibot@v1
      - name: Upload reports
        id: upload-reports
        if: always() && !env.ACT  # act: the image has no Node.js for this action
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports/
      - name: Job summary
        if: always()
        uses: solar-cooker-UHasselt/kicad-ci/actions/report-summary@v1
        with:
          reports-url: ${{ steps.upload-reports.outputs.artifact-url }}
