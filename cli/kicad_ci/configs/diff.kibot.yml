# KiBot config for kicad-ci diff: the board's schematic and PCB compared between
# two versions. Only the sheets and layers that differ are in the PDFs, added in
# green and removed in red.
#
# Set by the CLI with kibot -E:
#   OLD       the commit to compare with
#   NEW_TYPE  current (the files on disk) or git (a commit)
#   NEW       the commit for git, ignored for current
kibot:
  version: 1

global:
  # Check old versions out in a separate worktree, never stash or check out in
  # the board's own working tree. The default in KiBot 1.9, set to keep it.
  git_diff_strategy: worktree

outputs:
  - name: diff-sch
    comment: Schematic sheets that differ
    type: diff
    options:
      pcb: false
      old: "@OLD@"
      new_type: "@NEW_TYPE@"
      new: "@NEW@"
      only_different: true

  - name: diff-pcb
    comment: PCB layers that differ
    type: diff
    options:
      old: "@OLD@"
      new_type: "@NEW_TYPE@"
      new: "@NEW@"
      only_different: true
      dpi: 300
